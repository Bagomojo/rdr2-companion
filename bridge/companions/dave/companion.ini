; Dave: comic-relief sidekick, a movie-quoting guy from the present day. No secret past, never leaves.
; Copy this folder to make your own companion, then set Companion=<folder name> in DaveCompanion.ini.
[companion]
; Shown on subtitles and notices.
name = Dave
; ElevenLabs voice for this companion. Blank uses ELEVENLABS_VOICE_ID from bridge\.env.
voice_id =
; Voice loudness next to the game's own voices, 0.0 to 1.0. Blank uses COMPANION_VOICE_VOLUME or 0.4.
voice_volume =
; Comedy mode: the bridge picks a kind of joke each turn (movie quote, one-liner, fact...), uses
; the stronger model on quiet moments, and waits comment_cooldown_s between unprompted remarks.
comedy = yes
comment_cooldown_s = 75
; Hides where he's from until he trusts you enough to tell.
keeps_secret = no
; Can walk away for good if trust falls too low.
can_leave = no
